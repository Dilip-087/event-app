apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: event-app
  template:
    metadata:
      labels:        # Make sure 'labels:' is here
        app: event-app # And 'app:' is indented properly under it
    spec:
      containers:
      - name: event-container
        image: dilip087/event-app:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: event-service
spec:
  type: NodePort
  selector:
    app: event-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30020
